<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E7%B4%84%E4%BC%AF%E8%A8%98">約伯記</a><span aria-hidden="true">›</span><span aria-current="page">第 25 章</span></nav><article class="scroller seo-article"><h1 class="h1 md">約伯記 第 25 章</h1><div class="chapter-body commentary-body"><h4 class="ln ln-h3">（三）比勒達的發言 <span class="xref">25:1-25:6</span></h4>
<h5 class="ln ln-h4">1.比勒達認為神是偉大超越的，因此人無法在神面前稱義。<span class="xref">25:1-25:6</span></h5>
<p class="ln ln-bullet">●「治理之權」：表示神不是放任宇宙自生自滅，而是進行干預治理。</p>
<p class="ln ln-thought">◎因為這段的篇幅較短，許多學者就認為比勒達的發言一定是與約伯的發言混淆了。不過，說話不一定有固定長度，況且古抄本也都支持目前的結構，因此我們也就沒有理由隨意更改。</p>
<p class="ln ln-thought">◎比勒達基本上是重複以利法在<span class="xref">4:17-21</span>的論點。</p></div></article></main></div>
