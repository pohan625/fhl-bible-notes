<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E8%A9%A9%E7%AF%87">詩篇</a><span aria-hidden="true">›</span><span aria-current="page">第 134 章</span></nav><article class="scroller seo-article"><h1 class="h1 md">詩篇 第 134 章</h1><div class="chapter-body commentary-body"><h3 class="ln ln-h2">二十八、第一百三十四篇 <span class="xref">134</span></h3>
<p class="ln ln-thought">◎這一篇是整個上行之詩的最後一篇，以「站在聖殿中的」來結束。</p>
<p class="ln ln-bullet">●<span class="xref">134:1</span>一開始有個<span class="strong">SNH02009</span>，「看啊」，沒有被和合本翻譯出來。</p>
<p class="ln ln-thought">◎「耶和華的僕人」：這是一個通稱，不確定指的是哪些人。有人認為是指祭司或利未人，也有人認為是包括夜間到聖殿敬拜的以色列朝聖者。</p>
<p class="ln ln-bullet">●「稱頌」耶和華：<span class="strong">SNH01288</span>，「稱頌」、「祝福」。本段出現三次。</p>
<p class="ln ln-thought">◎<span class="xref">134:3</span>似乎與<span class="xref">民 6:22-26</span>大祭司對以色列人的祝福有關。</p></div></article></main></div>
