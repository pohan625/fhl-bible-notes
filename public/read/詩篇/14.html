<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E8%A9%A9%E7%AF%87">詩篇</a><span aria-hidden="true">›</span><span aria-current="page">第 14 章</span></nav><article class="scroller seo-article"><h1 class="h1 md">詩篇 第 14 章</h1><div class="chapter-body commentary-body"><h3 class="ln ln-h2">十四、第十四篇 <span class="xref">14</span> </h3>
<h4 class="ln ln-h3">（一）世人普遍邪惡，不求告上帝 <span class="xref">14:1-4</span></h4>
<p class="ln ln-bullet">●「愚頑人」：<span class="strong">SNH05036</span>，「愚笨的」、「無知的」。</p>
<p class="ln ln-bullet">●「明白的」：<span class="strong">SNH07919</span>，「領悟」、「有洞察力」。 </p>
<p class="ln ln-bullet">●「變為污穢」：SNH0444，「道德上的敗壞」、「被污染」，聖經中僅出現三次，<span class="xref">詩 14:3;53:3;伯 15:16</span>。</p>
<p class="ln ln-bullet">●「吃飯」：「吃穀物」、「吃麪包」。</p>
<div class="body-spacer" aria-hidden="true"></div>
<h4 class="ln ln-h3">（二）上帝要拯救子民脫離邪惡的世人<span class="xref">14:5-7</span></h4>
<p class="ln ln-bullet">●「謀算」：<span class="strong">SNH06098</span>，「商議」、「勸告」、「提議」。</p>
<p class="ln ln-thought">◎此處指的應該是外敵入侵擄走以色列人，但是上帝拯救被擄的以色列人。</p></div></article></main></div>
