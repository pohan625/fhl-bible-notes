<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E8%A9%A9%E7%AF%87">詩篇</a><span aria-hidden="true">›</span><span aria-current="page">第 70 章</span></nav><article class="scroller seo-article"><h1 class="h1 md">詩篇 第 70 章</h1><div class="chapter-body commentary-body"><h4 class="ln ln-h3">（二十）第七十篇  <span class="xref">70:1-5</span></h4>
<p class="ln ln-ref">○<span class="xref">詩 40:13-17</span>，除了「耶和華」與「神」的用詞不同外，兩邊幾乎一致。</p>
<p class="ln ln-thought">◎有幾個古希伯來抄本把<span class="xref">詩 70</span>與<span class="xref">詩 71</span>合成一篇長詩篇。</p>
<p class="ln ln-bullet">●「速速」：<span class="strong">SNH02363</span>，「急忙」、「趕快」。</p>
<p class="ln ln-bullet">●「阿哈」：<span class="strong">SNH01889</span>，「表達幸災樂禍的感嘆語」。</p>
<p class="ln ln-bullet">●「高興歡喜」：<span class="strong">SNH07797</span>+<span class="strong">SNH08055</span>，連續兩個意義相似的「歡喜」，用以加強語氣。</p>
<p class="ln ln-bullet">●「窮乏」：<span class="strong">SNH00034</span>，「需要幫助」、「需要從困境中解脫」。</p>
<p class="ln ln-thought">◎這一篇詩歌重點就是希望上帝快點來幫助自己。</p></div></article></main></div>
