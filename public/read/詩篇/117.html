<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E8%A9%A9%E7%AF%87">詩篇</a><span aria-hidden="true">›</span><span aria-current="page">第 117 章</span></nav><article class="scroller seo-article"><h1 class="h1 md">詩篇 第 117 章</h1><div class="chapter-body commentary-body"><h3 class="ln ln-h2">十一、第一百一十七篇：呼召萬國頌讚上帝  <span class="xref">117</span></h3>
<p class="ln ln-thought">◎<span class="xref">117</span>為詩篇中最短的一篇，也是全聖經最短的一章。</p>
<p class="ln ln-thought">◎保羅於<span class="xref">羅 15:11</span>，引用<span class="xref">117:1</span>，證明拯救外邦人是神的計畫。</p>
<p class="ln ln-bullet">●「大施」慈愛：<span class="strong">SNH01396</span>，「強健的」、「有力的」。</p>
<p class="ln ln-bullet">●「慈愛」：<span class="strong">SNH02617</span>，「履約的忠誠」、「慈愛」。</p>
<p class="ln ln-bullet">●「誠實」：<span class="strong">SNH00571</span>，「堅固」、「確實」、「可靠」。</p>
<p class="ln ln-thought">◎這篇以上帝的「慈愛」、「信實」屬性為理由，呼召萬國來頌讚上帝。我們能體會上帝的「信實」是祂非常值得被頌讚的屬性嗎？</p></div></article></main></div>
