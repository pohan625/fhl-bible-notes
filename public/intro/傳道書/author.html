<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E5%82%B3%E9%81%93%E6%9B%B8">傳道書</a><span aria-hidden="true">›</span><span aria-current="page">作者序</span></nav><article class="scroller seo-article"><h1 class="h1 md">作者序</h1><p>昨夜熬了一下，完成傳道書的查經資料。這卷書真的是蠻困難的，許多解釋分歧蠻大的，要選擇一個合理的好解釋需要極大的耐心與功力，顯然我就不是這樣的高手。勇於把傳道書查經資料貼出來，其實又要歸功於我個人認為電腦檔案是可以修改，所以後來的人可以踩在我的肩膀上往上擴充。所以雖然有許多經文的解釋真的是有點困難，可能我選擇的解釋並不是最好的，但我還是嘗試把這初步的結果分享給大家。</p></article></main></div>
