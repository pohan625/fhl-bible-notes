<div id="app"><main class="screen static-shell"><nav class="seo-breadcrumbs" aria-label="麵包屑"><a href="/">首頁</a><span aria-hidden="true">›</span><a href="/book/%E7%B4%84%E6%9B%B8%E4%BA%9E%E8%A8%98">約書亞記</a><span aria-hidden="true">›</span><span aria-current="page">作者序</span></nav><article class="scroller seo-article"><h1 class="h1 md">作者序</h1><p>這份研經資料，願意放棄著作權，歡迎轉載、引用，甚至修改。我想，或者透過這種Open Source的分享方式，可以把上帝的話傳達給更多的人知道，並且也希望有人可以站在這份研經資料的肩膀上繼續改進，讓網友可以有更好的資料可以取用。</p><p>查約書亞記，一起查考的人數漸漸由起初的4,5人減到2人。即使這樣，我們還是掙扎著把這卷書查完了。這卷書主要是由janewu,roxanne,張勝為,畢家興等人一起查考完成。未來，我們還會繼續努力，直到把所有的聖經經卷都查完。</p><p>tjm 2013.10.16</p></article></main></div>
