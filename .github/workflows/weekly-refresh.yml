# Weekly content refresh from bible.fhl.net/api/sc.php.
#
# Why GitHub Actions and not the Anthropic Code routine: Cloudflare on
# bible.fhl.net's WAF blocks data-center IPs (returns 403 to the routine
# runner regardless of headers). GitHub-hosted runners use a different IP
# range that the WAF passes through.
#
# Behaviour: full force-refetch (~22 min), regenerate the static SEO/PWA site,
# and — only if the tracked file changed — open a PR for review. No
# upstream change → no PR (no empty commits).
#
# The previous run's `source/sc_api_dump.json` is restored from the GH
# Actions cache before running, so refresh.js can produce a meaningful
# per-book diff. Without this, every run looks like "+66 books added"
# because the runner is fresh each time.

name: Weekly content refresh

on:
  # 每週日 01:00 UTC = 09:00 Asia/Taipei
  schedule:
    - cron: '0 1 * * 0'
  # 也可以從 Actions 頁面手動觸發
  workflow_dispatch:

# Need write to push branches and open PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # full fetch is ~22 min; cushion for slow upstream
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # We push a new branch from this checkout, so the default token
          # needs to remain on the working directory. fetch-depth: 0 isn't
          # required (we only diff against HEAD), so leave the default.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'    # native fetch() is required (Node 18+)

      # Restore the previous run's dump so refresh.js can diff against it.
      # Rolling-cache pattern: unique key per run (always misses, always
      # saves at job end) plus a prefix restore-keys that matches the most
      # recent previous save. GitHub auto-purges old cache entries when the
      # 10 GB quota fills; sc_api_dump.json is ~12 MB so we have headroom
      # for hundreds of weekly runs.
      - name: Restore previous dump from cache
        id: cache-dump
        uses: actions/cache@v5
        with:
          path: source/sc_api_dump.json
          key: sc-api-dump-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sc-api-dump-

      - name: Report cache state
        run: |
          if [ -f source/sc_api_dump.json ]; then
            echo "✓ Previous dump restored ($(stat -c%s source/sc_api_dump.json) bytes)"
          else
            echo "ℹ No cached dump found — first run, diff will report '+66 books added' once."
          fi

      - name: Run refresh-and-diff
        id: refresh
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          # Tee output so we can extract the diff summary later.
          set -o pipefail
          npm run refresh-and-diff 2>&1 | tee /tmp/refresh-output.log

      - name: Detect tracked-file changes
        id: detect
        run: |
          # source/ and design/ are gitignored; generated public/ route pages,
          # shared assets, sitemap, and service worker change with the corpus.
          if [ -z "$(git status --short)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ No upstream content changes — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tracked changes detected:"
            git status --short
          fi

      - name: Update displayed last updated date
        if: steps.detect.outputs.changed == 'true'
        id: update-date
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: |
          set -euo pipefail
          DISPLAY_DATE=$(TZ=Asia/Taipei date +%-Y/%-m/%-d)
          echo "display_date=${DISPLAY_DATE}" >> "$GITHUB_OUTPUT"

          node build/update-last-updated-date.js "$DISPLAY_DATE"
          node build/build.js
          EXPECTED_LAST_UPDATED_DATE="$DISPLAY_DATE" node build/verify-last-updated.js
          npm run test:seo

      - name: Open PR with refreshed content
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          DISPLAY_DATE="${{ steps.update-date.outputs.display_date }}"
          BRANCH="weekly-refresh-${DATE}"

          # Extract the diff summary block from the refresh.js output —
          # everything between the two banner lines.
          DIFF_BLOCK=$(awk '/=== Diff vs previous dump ===/{flag=1; next} /=== Refresh complete ===/{flag=0} flag' /tmp/refresh-output.log || true)
          if [ -z "$DIFF_BLOCK" ]; then
            DIFF_BLOCK="(no per-book diff captured — likely a first-time fetch on this runner; full refetch produced new static site artifacts)"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add build/template.html public
          git commit -m "Weekly content refresh: ${DATE}

          ${DIFF_BLOCK}

          🤖 Generated by GitHub Actions weekly-refresh workflow"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly content refresh: ${DATE}" \
            --body "$(cat <<EOF
          Automated weekly refresh from \`bible.fhl.net/api/sc.php\`.

          ## Per-book diff

          \`\`\`
          ${DIFF_BLOCK}
          \`\`\`

          ## Notes

          - Triggered by the \`weekly-refresh.yml\` workflow on \`${DATE}\` (Asia/Taipei).
          - Displayed last updated date is \`${DISPLAY_DATE}\`.
          - Source dump (\`source/sc_api_dump.json\`) is gitignored; rebuilt static routes, shared assets, sitemap, service worker, and the display-date source in \`build/template.html\` are committed.
          - If something looks off after merging, revert the merge commit — the previous generated site will come back unchanged.
          EOF
          )"
